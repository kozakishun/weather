# 気象庁から気象データを取得して weather_data.js を更新する（毎日 9:00 JST ごろ）
name: 気象データ更新

on:
  schedule:
    - cron: "0 0 * * *"   # 毎日 0:00 UTC = 9:00 日本時間
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 気象庁からデータ取得
        run: node fetch/fetch_jma.js
      - name: 変更があれば保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather_data.js
          if git diff --cached --quiet; then echo "変更なし"; else git commit -m "気象データ更新 $(date +%F)" && git push; fi
